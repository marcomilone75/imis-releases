name: Render Keep-Alive

# Backup pinger for the IMIS NestJS backend on Render (free plan).
#
# The PRIMARY keep-alive is UptimeRobot (account marcomilone75@gmail.com),
# which hits /api/health every 5 minutes. GitHub Actions cron is NOT reliable
# for this job: high-frequency schedules on free repos get throttled to one
# run every ~2-3 hours, so a */12 cron never actually kept Render warm.
#
# This workflow stays as a cheap secondary check. "All jobs were cancelled"
# emails with the annotation "job was not acquired by Runner" are a GitHub
# runner shortage, not a bug here.
#
# Lives in the PUBLIC imis-releases repo because public repos get unlimited
# Actions minutes.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/health
        run: |
          URL="https://imis-backend-wlok.onrender.com/api/health"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 "$URL")
          echo "HTTP $code from $URL"
          if [ "$code" != "200" ]; then
            echo "::error::Render health check returned $code, expected 200"
            exit 1
          fi
